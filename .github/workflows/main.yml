name: Build Signed Android App Bundle

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "ERROR: KEYSTORE_BASE64 secret is not set"; exit 1; }
          [ -n "$STORE_PASSWORD" ]  || { echo "ERROR: STORE_PASSWORD secret is not set";  exit 1; }
          [ -n "$KEY_ALIAS" ]       || { echo "ERROR: KEY_ALIAS (or KEYSTORE_ALIAS) secret is not set"; exit 1; }
          [ -n "$KEY_PASSWORD" ]    || { echo "ERROR: KEY_PASSWORD secret is not set";     exit 1; }

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/release.keystore
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV

      - name: Build Release AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  publish-download-page:
    name: Publish Bundle Download Page
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download release bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-release-aab
          path: bundle

      - name: Build download page
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p site
          bundle_file="$(find bundle -type f -name '*.aab' | head -n 1)"
          if [ -z "$bundle_file" ]; then
            echo "::error::No .aab file found in downloaded artifact."
            exit 1
          fi

          bundle_name="com.picavox.app-${RUN_NUMBER}.aab"
          cp "$bundle_file" "site/$bundle_name"
          BUNDLE_NAME="$bundle_name" python - <<'PY'
          import html
          import os
          from pathlib import Path

          bundle_name = html.escape(os.environ["BUNDLE_NAME"], quote=True)
          run_number = html.escape(os.environ["RUN_NUMBER"], quote=True)
          commit_sha = html.escape(os.environ["COMMIT_SHA"], quote=True)

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PicaVox Release Bundle</title>
          </head>
          <body>
            <main>
              <h1>PicaVox Release Bundle</h1>
              <p>Download the latest Android App Bundle (.aab) and upload it to Google Play Console package <code>com.picavox.app</code>.</p>
              <p><a href="./{bundle_name}" download>Download {bundle_name}</a></p>
              <p>Run: #{run_number}</p>
              <p>Commit: {commit_sha}</p>
            </main>
          </body>
          </html>
          """
          Path("site/index.html").write_text(page, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
